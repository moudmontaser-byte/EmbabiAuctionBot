name: Inspect legacy hidden-player-style source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect_zip.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect turn and OCR core
        shell: bash
        run: |
          rm -rf /tmp/legacy
          mkdir -p /tmp/legacy
          unzip -q EmbabiAuctionBot_V0.1_CloudBuild.zip -d /tmp/legacy
          F=/tmp/legacy/HiddenPlayerBot_v10/app/src/main/java/com/embabi/hiddenplayer/HiddenPlayerAccessibilityService.java
          echo "===== 300-430 ====="
          sed -n '300,430p' "$F"
          echo "===== 431-560 ====="
          sed -n '431,560p' "$F"

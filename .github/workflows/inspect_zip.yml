name: Inspect legacy hidden-player-style source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect_zip.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect key UI and screen-reading source
        shell: bash
        run: |
          rm -rf /tmp/legacy
          mkdir -p /tmp/legacy
          unzip -q EmbabiAuctionBot_V0.1_CloudBuild.zip -d /tmp/legacy
          BASE=/tmp/legacy/HiddenPlayerBot_v10/app/src/main/java/com/embabi/hiddenplayer
          for f in MainActivity.java OverlayService.java HiddenPlayerAccessibilityService.java BotActions.java Prefs.java; do
            echo "===== BEGIN $f ====="
            cat "$BASE/$f"
            echo "===== END $f ====="
          done

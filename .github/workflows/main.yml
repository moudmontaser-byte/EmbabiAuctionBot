name: Build Embabi Auction Genius APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EmbabiAuctionBot/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: EmbabiAuctionBot
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmbabiAuctionGenius-v2-APK
          path: EmbabiAuctionBot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Embabi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'EmbabiAuctionBot*.zip' | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK Manager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Enable AndroidX
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle -print -quit)")
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          echo "Gradle properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          cd "$PROJECT_DIR"
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmbabiAuctionBot-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

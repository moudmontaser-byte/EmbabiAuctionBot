name: Build Embabi Auction Genius APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EmbabiAuctionBot/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK Manager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: EmbabiAuctionBot
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmbabiAuctionGenius-v17-HIDDENPLAYER-READER-APK
          path: EmbabiAuctionBot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create reusable source ZIP
        shell: bash
        run: |
          rm -f EmbabiAuctionGenius_UPLOAD_TO_BUILD.zip
          zip -qr EmbabiAuctionGenius_UPLOAD_TO_BUILD.zip EmbabiAuctionBot

      - name: Upload reusable source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EmbabiAuctionGenius-v17-HIDDENPLAYER-READER-SOURCE
          path: EmbabiAuctionGenius_UPLOAD_TO_BUILD.zip
          if-no-files-found: error

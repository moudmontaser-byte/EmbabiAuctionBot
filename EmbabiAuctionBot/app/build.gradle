plugins {
    id 'com.android.application'
}

android {
    namespace 'com.embabi.auctionbot'
    compileSdk 35

    defaultConfig {
        applicationId "com.embabi.auctionbot"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName "2.0-smart-auction"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
